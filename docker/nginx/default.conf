# =================================================================
# LifeOS Nginx 生产反向代理与静态资源托管配置
# =================================================================

# 开启 Gzip 传输压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
gzip_vary on;
gzip_disable "MSIE [1-6]\.";

# 全局安全响应头
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 后端 Upstream 集群配置
upstream lifeos_backend {
    server backend:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # 客户端上传报文大小限制（用于头像等文件上传）
    client_max_body_size 20M;

    # 1. 后端 RESTful API 反向代理
    location /api/ {
        proxy_pass http://lifeos_backend/api/;
        proxy_http_version 1.1;

        # 转发真实客户端信息与安全凭据
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时时间设置
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;

        # 缓冲优化
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 16k;
    }

    # 2. 管理端 Web (Vue 3 + Element Plus 单页应用)
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        # 静态资源长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    # 3. 用户端 H5 (uni-app Vue 3 移动应用)
    location / {
        root /usr/share/nginx/html/user-app;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML 文件不进行强缓存，保证应用热更新实时生效
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 静态资源文件长期缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }
    }

    # 4. 404 / 500 友好错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

