version: '3.8'

services:
  # 1. 关系型数据库 MySQL 8.0
  mysql:
    image: mysql:8.0.36
    container_name: lifeos-mysql
    restart: always
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --max_connections=500
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_2026}
      MYSQL_DATABASE: ${DB_NAME:-lifeos}
      MYSQL_USER: ${DB_USER:-lifeos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lifeos_secure_password_2026}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docs/lifeos_schema_mysql8.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      # 如仅容器间通信可不暴露宿主机端口，若需本地数据库管理工具访问可暴露 3306
      - "${MYSQL_PORT_EXPOSE:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lifeos_net

  # 2. 核心后端应用服务 (Spring Boot 3 + JDK 21)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lifeos-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lifeos}
      DB_USER: ${DB_USER:-lifeos}
      DB_PASSWORD: ${DB_PASSWORD:-lifeos_secure_password_2026}
      JWT_SECRET: ${JWT_SECRET:-lifeos-jwt-secret-key-must-be-at-least-256-bits-long-2026-lifeos-system-key}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
      LOG_FILE_PATH: /var/log/lifeos/app.log
      TZ: Asia/Shanghai
    volumes:
      - lifeos_logs:/var/log/lifeos
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health-check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - lifeos_net

  # 3. 接入层反向代理与静态网站托管 Nginx
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: lifeos-nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin-web/dist:/usr/share/nginx/html/admin:ro
      - ./user-app/dist/build/h5:/usr/share/nginx/html/user-app:ro
    networks:
      - lifeos_net

volumes:
  mysql_data:
    driver: local
  lifeos_logs:
    driver: local

networks:
  lifeos_net:
    driver: bridge

